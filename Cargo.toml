[package]
name = "spellcheck-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
ollama-rs = { version = "0.3.6", default-features = false, features = ["rustls"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
dirs = "7.0"
colored = "3.1"
similar = "3.2"
